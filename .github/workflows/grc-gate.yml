name: GRC Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  grc-gate:
    name: Plan, policy, apply, sign, upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3

      - name: Install OPA and Conftest
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Plan
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Policy check
        run: scripts/policy-gate.sh terraform/plan.json policies

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.3

      - name: Sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          BUNDLE=$(scripts/evidence-bundle.sh evidence terraform/plan.json)
          cosign sign-blob --yes "$BUNDLE" \
            --bundle "${BUNDLE}.sigstore.json" \
            --output-signature "${BUNDLE}.sig"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          EVIDENCE_BUCKET=$(terraform -chdir=terraform output -raw evidence_bucket)
          PREFIX="evidence/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp "$BUNDLE" "s3://${EVIDENCE_BUCKET}/${PREFIX}/$(basename "$BUNDLE")"
          aws s3 cp "${BUNDLE}.sha256" "s3://${EVIDENCE_BUCKET}/${PREFIX}/$(basename "$BUNDLE").sha256"
          aws s3 cp "${BUNDLE}.sig" "s3://${EVIDENCE_BUCKET}/${PREFIX}/$(basename "$BUNDLE").sig"
          aws s3 cp "${BUNDLE}.sigstore.json" "s3://${EVIDENCE_BUCKET}/${PREFIX}/$(basename "$BUNDLE").sigstore.json"
